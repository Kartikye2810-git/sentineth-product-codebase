# Development deployment: docker compose -f docker-compose.yml -f compose.app.yml up -d
# Uses the existing local database. Run migrations and initialize-vectors first.
x-app: &app
  build: .
  image: sentineth:phase3
  env_file: .env
  environment:
    QDRANT_URL: http://qdrant:6333
    DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL for the postgres service hostname}
    SENTINETH_STORAGE_DIR: /data/documents
  volumes:
    - ./backend/storage/documents:/data/documents
  depends_on:
    postgres:
      condition: service_healthy
    qdrant:
      condition: service_started
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: [python, -m, app.worker]
    healthcheck:
      disable: true
