name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentineth
          POSTGRES_PASSWORD: sentineth
          POSTGRES_DB: sentineth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentineth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database for this run only. The app reads DATABASE_URL from
      # the environment, so no .env file is needed (and none is committed).
      DATABASE_URL: postgresql+psycopg://sentineth:sentineth@localhost:5432/sentineth_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheel first: the default PyPI torch wheel pulls the CUDA stack,
          # which is a multi-GB download this runner has no use for.
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: pytest
        env:
          TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: alembic check
        # Fails if app/db/models.py has drifted from alembic/versions.
        run: alembic check

  eval:
    # Non-blocking on purpose, and it must never be added to the required
    # checks. Retrieval quality is a number to watch and argue about, not a
    # gate: a legitimate change can move recall a point in either direction,
    # and a red X for that would only teach everyone to ignore red Xs. The
    # `backend` job above is the one that decides whether a PR can merge.
    name: eval (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    env:
      QDRANT_URL: http://localhost:6333
      # nemotron-3-embed-1b is the model the application runs, so score it
      # when a key is reachable. Pull requests from forks get no secrets, so
      # the step below falls back to the offline model rather than producing
      # no number at all. Which one ran is printed in the report and in the
      # PR comment, so the two can never be quoted as the same measurement.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for Qdrant
        # Polled from the runner rather than declared as a service
        # `--health-cmd`: the qdrant image ships no curl or wget, so a
        # health command running inside the container never succeeds.
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:6333/healthz > /dev/null; then
              echo "qdrant ready"
              exit 0
            fi
            sleep 2
          done
          echo "qdrant did not become ready in 60s"
          exit 1

      - name: Render the corpus
        # PDFs are built from the markdown sources rather than committed, so
        # the corpus stays diffable and this step also exercises the renderer.
        run: python eval/build_corpus.py

      - name: Score retrieval
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then
            provider=nvidia
          else
            echo "::notice::No NVIDIA_API_KEY in this context - scoring the offline fallback model, not the one production serves."
            provider=local
          fi
          python eval/harness.py --provider "$provider" --report eval-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: backend/eval-report.json

      - name: Comment the numbers on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('backend/eval-report.json', 'utf8'));
            const m = r.metrics;
            const c = r.configuration;
            const pct = (x) => `${(x * 100).toFixed(1)}%`;

            const body = [
              '**Retrieval eval**',
              '',
              `| recall@1 | recall@3 | recall@5 | MRR |`,
              `| --- | --- | --- | --- |`,
              `| ${pct(m['recall@1'])} | ${pct(m['recall@3'])} | ` +
                `${pct(m['recall@5'])} | ${m.mrr.toFixed(3)} |`,
              '',
              `${r.corpus.documents} documents / ${r.corpus.chunks} chunks · ` +
                `${r.questions.total} questions · ${c.embedding_provider} ` +
                `(${c.dimension}d) · ${c.retrieval}` +
                `${c.rerank ? ` + rerank top ${c.rerank.depth}` : ''} · ` +
                `chunker ${c.chunker.chunk_tokens} tokens / ` +
                `${(c.chunker.overlap_ratio * 100).toFixed(0)}% overlap`,
              '',
              '<sub>This job is advisory and never blocks a merge. Chunk count ' +
                'is part of the result: recall@5 over more, smaller chunks is a ' +
                'harder test than the same number over fewer, larger ones.</sub>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
